version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: aplikacja-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-aplikacja_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aplikacja-network
    restart: always

  redis:
    image: redis:7-alpine
    container_name: aplikacja-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - aplikacja-network
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aplikacja-backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-admin}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-aplikacja_db}?schema=public
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-change-me}
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend/lynx_data:/app/lynx_data
    networks:
      - aplikacja-network
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aplikacja-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - aplikacja-network
    restart: always

volumes:
  postgres_data:
  redis_data:


networks:
  aplikacja-network:
    driver: bridge
