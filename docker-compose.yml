version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: aplikacja-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aplikacja_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aplikacja-network

  redis:
    image: redis:7-alpine
    container_name: aplikacja-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - aplikacja-network
      
volumes:
  postgres_data:
  redis_data:

networks:
  aplikacja-network:
    driver: bridge
